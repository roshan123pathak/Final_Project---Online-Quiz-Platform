<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Login - Quiz Master</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chat-widget.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header">
                <h1 class="logo"><span class="logo-emoji">🧠</span> Quiz Master</h1>
                <p class="login-subtitle">Test your knowledge, track your progress</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            
            <button id="guest-login" class="guest-btn">Continue as Guest</button>
            
            <div class="login-divider">
                <span>OR</span>
            </div>
            
            <div class="social-login">
                <button id="google-login" class="social-btn google">
                    <span class="social-icon google-icon"></span>
                    <span>Continue with Google</span>
                </button>
                <button id="facebook-login" class="social-btn facebook">
                    <span class="social-icon facebook-icon"></span>
                    <span>Continue with Facebook</span>
                </button>
            </div>
            
            <p class="signup-prompt">
                Don't have an account? <a href="#" id="signup-link">Sign up</a>
            </p>
        </div>
        
        <div class="login-image">
            <div class="overlay">
                <div class="quote">
                    <p>"The more that you read, the more things you will know. The more that you learn, the more places you'll go."</p>
                    <cite>- Dr. Seuss</cite>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="chat-widget.js"></script>
</body>
</html>
